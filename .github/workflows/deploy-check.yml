name: Deploy Verification - Vercel Build Matrix

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-matrix:
    name: Verify App Build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - portfolio-01-minimal
          - portfolio-02-dev
          - portfolio-03-interactive
          - portfolio-04-vite-express
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build targeted app (${{ matrix.app }})
        run: pnpm --filter ${{ matrix.app }} build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
